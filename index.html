<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 未來科技論壇</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="#">FutureTech 2026</a>
      </div>
    </nav>

    <header class="hero-section d-flex align-items-center text-white text-center">
      <div class="container" data-aos="zoom-in">
        <h1 class="display-2 fw-bold">探索人工智慧的下一個十年</h1>
        <p class="lead">2026/10/20 - 台北國際會議中心</p>
        <button class="btn btn-primary btn-lg mt-4">立即報名</button>
      </div>
    </header>

    <section class="py-5 bg-light">
      <div class="container">
        <h2 class="text-center mb-5" data-aos="fade-up">大會議程</h2>
        <div class="row g-4">
          <div class="col-md-4" data-aos="flip-left">
            <div class="card h-100">
              <div class="card-body">
                <h5 class="card-title text-primary">09:00 - 10:00</h5>
                <p class="card-text">開幕主題演講：通用 AI 的崛起</p>
              </div>
            </div>
          </div>
          </div>
      </div>
    </section>

    <section class="py-5">
      <div class="container text-center">
        <h2 class="mb-5" data-aos="fade-right">重量級講者</h2>
        <div class="row">
          <div class="col-md-3" data-aos="fade-up">
            <img src="https://i.pravatar.cc/150?u=1" class="rounded-circle mb-3" alt="Speaker">
            <h5>Dr. AI Specialist</h5>
            <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#speakerModal">查看介紹</button>
          </div>
        </div>
      </div>
    </section>

    <section class="py-5 bg-dark text-white">
      <div class="container" data-aos="fade-in">
        <h2 class="text-center mb-4">聯絡我們</h2>
        <form class="mx-auto" style="max-width: 600px;">
          <input type="email" class="form-control mb-3" placeholder="您的電子信箱">
          <textarea class="form-control mb-3" rows="3" placeholder="您的訊息"></textarea>
          <button class="btn btn-primary w-100">送出</button>
        </form>
      </div>
    </section>



    <section id="info" class="py-5 bg-light" data-aos="fade-up">
  <div class="container">
    <h2 class="text-center mb-4">活動資訊</h2>
    <div class="row text-center">
      <div class="col-md-4">
        <h4>交通方式</h4>
        <p>台北捷運信義線「世貿站」5號出口</p>
      </div>
      <div class="col-md-4">
        <h4>地理位置</h4>
        <p>台北國際會議中心 101 會議室</p>
      </div>
      <div class="col-md-4">
        <h4>住宿優惠</h4>
        <p>憑論壇票根享周邊飯店 8 折優惠</p>
      </div>
    </div>
  </div>
</section>



   <script type="module" src="/main.js"></script>
</body>
</html>
